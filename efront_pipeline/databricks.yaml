bundle:
  name: xio-efront

xio_common_tags: &xio_common_tags
  type: efront
  team: XIO
  bundle_target: ${bundle.target}
  pr_id: ${var.pr_id}

variables:
  pr_id:
    description: GitHub pull request number (set by CI)
    default: 'none'
  ENV:
    description: 'Environment variable used across notebooks + DLT (DEV in dev/staging, empty in prod)'
    default: 'DEV'
  development_prefix:
      description: 'Prefix for database objects'
      default: '${workspace.current_user.short_name}_'
  data_catalog:
    description: 'Per-target catalog for all efront layer tables (prod-only for oegen_data_prod_prod)'
    default: 'oegen_data_prod_test'
  landing_schema:
    description: 'Schema for raw ingested/landing tables'
    default: 'efront_landing'
  bronze_schema:
    description: 'Schema for bronze layer tables'
    default: 'efront_bronze'
  silver_schema:
    description: 'Schema for silver layer tables'
    default: 'efront_silver'
  gold_schema:
    description: 'Schema for gold layer tables'
    default: 'efront_gold'

targets:
  dev_test:
    mode: development
    workspace:
      host: https://octoenergy-oegen-prod.cloud.databricks.com/
    variables:
      ENV: 'DEV'
      development_prefix: '${workspace.current_user.short_name}_'
      data_catalog: 'oegen_data_prod_test'

  staging:
    mode: production
    workspace:
      host: https://octoenergy-oegen-prod.cloud.databricks.com/
      root_path: /XIO/DEV/${bundle.name}
    variables:
      ENV: 'DEV'
      development_prefix: ''
      data_catalog: 'oegen_data_prod_source'
    resources:
      jobs:
        xio_efront_scheduled:
          schedule:
            quartz_cron_expression: '0 20 7 ? * SUN'
            timezone_id: UTC
            pause_status: UNPAUSED
        xio_efront_manual:
          schedule: null

  prod:
    mode: production
    workspace:
      host: https://octoenergy-oegen-prod.cloud.databricks.com/
      root_path: /XIO/PROD/${bundle.name}
    variables:
      ENV: ''
      development_prefix: ''
      data_catalog: 'oegen_data_prod_prod'
    resources:
        jobs:
          xio_efront_scheduled:
            schedule:
              quartz_cron_expression: '0 20 6-18 * * ?' # everyday at 20 minutes past the hour from 6:20AM to 6:20PM
              timezone_id: UTC
              pause_status: UNPAUSED
          xio_efront_manual:
            schedule: null

resources:
  jobs:
    xio_efront_scheduled:
      name: xio_efront_scheduled_${bundle.target}
      permissions:
        - group_name: 'Sennen XIO Project'
          level: CAN_MANAGE
      max_concurrent_runs: 1

      tasks:
        - task_key: api_ingestion_scheduled
          notebook_task:
            notebook_path: ./ingestion/api_ingestion_load.ipynb
            base_parameters:
              BUNDLE_ENV: ${var.ENV}
              BUNDLE_TARGET: ${bundle.target}
              TABLE_PARAMETERS_MODULE: 'api_ingestion_parameters_scheduled'
              development_prefix: ${var.development_prefix}
              DATA_CATALOG: ${var.data_catalog}
              LANDING_SCHEMA: ${var.landing_schema}

        - task_key: union_historics_and_api_ingested
          depends_on:
                - task_key: api_ingestion_scheduled
          notebook_task:
            notebook_path: ./efront_specific/unify_tables.ipynb
            base_parameters:
              BUNDLE_ENV: ${var.ENV}
              BUNDLE_TARGET: ${bundle.target}
              TABLE_PARAMETERS_MODULE: 'union_parameters_scheduled'
              development_prefix: ${var.development_prefix}
              DATA_CATALOG: ${var.data_catalog}
              LANDING_SCHEMA: ${var.landing_schema}

        # - task_key: cdm_checker
        #   depends_on:
        #       - task_key: bronze_dlt
        #   notebook_task:
        #     notebook_path: ./cdm_checker/cdm_checker_code.ipynb
        #     base_parameters:
        #       BUNDLE_ENV: ${var.ENV}
        #       BUNDLE_TARGET: ${bundle.target}
        #       development_prefix: ${var.development_prefix}
        #       DATA_CATALOG: ${var.data_catalog}
        #       LANDING_SCHEMA: ${var.landing_schema}
        #       BRONZE_SCHEMA: ${var.bronze_schema}
        #       SILVER_SCHEMA: ${var.silver_schema}
        #       GOLD_SCHEMA: ${var.gold_schema}

        - task_key: bronze_dlt
          depends_on:
            - task_key: union_historics_and_api_ingested
          pipeline_task:
            pipeline_id: ${resources.pipelines.bronze_pipeline_scheduled.id}
            full_refresh: true

        - task_key: silver_entry
          depends_on:
            - task_key: bronze_dlt
          notebook_task:
            notebook_path: ./silver_layer/silver_models/silver_entry.ipynb
            base_parameters:
              BUNDLE_ENV: ${var.ENV}
              BUNDLE_TARGET: ${bundle.target}
              TABLE_PARAMETERS_MODULE: 'silver_model_parameters_scheduled'
              development_prefix: ${var.development_prefix}
              DATA_CATALOG: ${var.data_catalog}
              LANDING_SCHEMA: ${var.landing_schema}
              BRONZE_SCHEMA: ${var.bronze_schema}
              SILVER_SCHEMA: ${var.silver_schema}
              GOLD_SCHEMA: ${var.gold_schema}

        - task_key: silver_dlt
          depends_on:
            - task_key: silver_entry
          max_retries: 0
          pipeline_task:
            pipeline_id: ${resources.pipelines.silver_pipeline_scheduled.id}
            full_refresh: true

        - task_key: gold_entry
          depends_on:
            - task_key: silver_dlt
          notebook_task:
            notebook_path: ./gold_layer/gold_models/gold_entry.ipynb
            base_parameters:
              BUNDLE_TARGET: ${bundle.target}
              development_prefix: ${var.development_prefix}
              table_parameters_module: 'gold_table_parameters_scheduled'
              view_parameters_module: ''
              definitions_module: 'gold_layer_definitions_scheduled'
              DATA_CATALOG: ${var.data_catalog}
              LANDING_SCHEMA: ${var.landing_schema}
              BRONZE_SCHEMA: ${var.bronze_schema}
              SILVER_SCHEMA: ${var.silver_schema}
              GOLD_SCHEMA: ${var.gold_schema}

      tags: *xio_common_tags


    xio_efront_manual:
      name: xio_efront_manual_${bundle.target}
      permissions:
        - group_name: 'Sennen XIO Project'
          level: CAN_MANAGE
      max_concurrent_runs: 1

      tasks:
        - task_key: api_ingestion_manual
          notebook_task:
            notebook_path: ./ingestion/api_ingestion_load.ipynb
            base_parameters:
              BUNDLE_TARGET: ${bundle.target}
              TABLE_PARAMETERS_MODULE: 'api_ingestion_parameters_manual'
              development_prefix: ${var.development_prefix}
              DATA_CATALOG: ${var.data_catalog}
              LANDING_SCHEMA: ${var.landing_schema}

        - task_key: union_historics_and_api_ingested
          depends_on:
                - task_key: api_ingestion_manual
          notebook_task:
            notebook_path: ./efront_specific/unify_tables.ipynb
            base_parameters:
              BUNDLE_ENV: ${var.ENV}
              BUNDLE_TARGET: ${bundle.target}
              TABLE_PARAMETERS_MODULE: 'union_parameters_manual'
              development_prefix: ${var.development_prefix}
              DATA_CATALOG: ${var.data_catalog}
              LANDING_SCHEMA: ${var.landing_schema}

        # - task_key: cdm_checker
        #   depends_on:
        #       - task_key: bronze_dlt
        #   notebook_task:
        #     notebook_path: ./cdm_checker/cdm_checker_code.ipynb
        #     base_parameters:
        #       BUNDLE_ENV: ${var.ENV}
        #       BUNDLE_TARGET: ${bundle.target}
        #       development_prefix: ${var.development_prefix}
        #       DATA_CATALOG: ${var.data_catalog}
        #       LANDING_SCHEMA: ${var.landing_schema}
        #       BRONZE_SCHEMA: ${var.bronze_schema}
        #       SILVER_SCHEMA: ${var.silver_schema}
        #       GOLD_SCHEMA: ${var.gold_schema}

        - task_key: bronze_dlt
          depends_on:
            - task_key: union_historics_and_api_ingested
          pipeline_task:
            pipeline_id: ${resources.pipelines.bronze_pipeline_manual.id}
            full_refresh: true

      tags: *xio_common_tags

  

  pipelines:
    bronze_pipeline_scheduled:
      name: xio_efront_bronze_scheduled_pipeline_${bundle.target}
      catalog: ${var.data_catalog}
      schema: ${var.bronze_schema}
      serverless: true
      configuration:
        spark.xio.bundle_env: ${var.ENV}
        spark.xio.bundle_target: ${bundle.target}
        xio.table_parameters_module: 'bronze_table_parameters_scheduled'
        xio.pipeline_type: 'scheduled'
        xio.development_prefix: ${var.development_prefix}
        xio.data_catalog: ${var.data_catalog}
        xio.landing_schema: ${var.landing_schema}
        xio.bronze_schema: ${var.bronze_schema}
        xio.silver_schema: ${var.silver_schema}
        xio.gold_schema: ${var.gold_schema}
      permissions:
        - group_name: 'Sennen XIO Project'
          level: CAN_MANAGE
      continuous: false
      edition: advanced
      libraries:
        - notebook: 
            path: ./bronze_layer/bronze_dlt_load.py ###### .ipynb doesn't work

    bronze_pipeline_manual:
      name: xio_efront_bronze_manual_pipeline_${bundle.target}
      catalog: ${var.data_catalog}
      schema: ${var.bronze_schema}
      serverless: true
      configuration:
        spark.xio.bundle_env: ${var.ENV}
        spark.xio.bundle_target: ${bundle.target}
        xio.table_parameters_module: 'bronze_table_parameters_manual'
        xio.pipeline_type: 'manual'
        xio.development_prefix: ${var.development_prefix}
        xio.data_catalog: ${var.data_catalog}
        xio.landing_schema: ${var.landing_schema}
        xio.bronze_schema: ${var.bronze_schema}
        xio.silver_schema: ${var.silver_schema}
        xio.gold_schema: ${var.gold_schema}
      permissions:
        - group_name: 'Sennen XIO Project'
          level: CAN_MANAGE
      continuous: false
      edition: advanced
      libraries:
        - notebook: 
            path: ./bronze_layer/bronze_dlt_load.py ###### .ipynb doesn't work


    silver_pipeline_scheduled:
      name: xio_efront_silver_scheduled_pipeline_${bundle.target}
      catalog: ${var.data_catalog}
      schema: ${var.silver_schema}
      serverless: true
      configuration:
        spark.xio.bundle_env: ${var.ENV}
        spark.xio.bundle_target: ${bundle.target}
        xio.table_parameters_module: 'silver_table_parameters_scheduled'
        xio.pipeline_type: 'scheduled'
        xio.development_prefix: ${var.development_prefix}
        xio.data_catalog: ${var.data_catalog}
        xio.landing_schema: ${var.landing_schema}
        xio.bronze_schema: ${var.bronze_schema}
        xio.silver_schema: ${var.silver_schema}
        xio.gold_schema: ${var.gold_schema}
      permissions:
        - group_name: 'Sennen XIO Project'
          level: CAN_MANAGE
      continuous: false
      edition: advanced
      libraries:
        - notebook:
            path: ./silver_layer/silver_dlt_load.py ###### .ipynb doesn't work
